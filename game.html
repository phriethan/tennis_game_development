<html>
	Tennis Game Built on HTML ...   
	<canvas id = "gameCanvas" width = "800"
	height = "600"> </canvas>


	<script>
		const WINNING_SCORE = 3;
		const PADDLE_HEIGHT = 100;
		const PADDLE_THICKNESS = 10;
		
		// ui container
		var canvas;

		// graphical info
		var canvas_context; 

		// x and y position
		var ball_x = 50;
		var ball_y = 50;

		var p_1_score = 0;
		var p_2_score = 0;

		var win_screen = false;

		// variables for ball speed in x and y directions
		var b_vel_x = 15;
		var b_vel_y = 5;

		var user_paddle = 250;
		var ai_paddle = 250;

		// event handling function computes the user's mouse position
		// evt is the event
		function mouse_position(evt) {
			
			// retrieves size of canvas & it's position relative to viewport
			var field = canvas.getBoundingClientRect();

			// gets reference to root element (canvas)
			var root = document.documentElement;

			// clientX & client Y are properties (NOT variables) of the event
			// clientX is horizontal position of mouse pointer
			// clientY is veritcal position of mouse pointer
			var mouse_x = evt.clientX - field.left - root.scrollLeft;
			var mouse_y = evt.clientY - field.top - root.scrollTop;
			
			return {
				x:mouse_x,
				y:mouse_y
			};
		}

		function handle_mouse_click(evt) {
			if (win_screen) {
				p_1_score = p_2_score = 0;
				win_screen = false;
			}
		}

		window.onload = function() {
			console.log("TENNIS");
			
			// initial reference to root element in html
			canvas = document.getElementById('gameCanvas');
			canvas_context = canvas.getContext('2d');
			
			var fps = 30;
			setInterval(function() {
			moveEverything();
			drawEverything(); 
			} , 1000/fps); // setting an interval of how much time is taken to call drawEverything

			canvas.addEventListener('mousedown', handle_mouse_click); //'mousedown' is a keyword

			// to handle input you add an .addEventListener
			canvas.addEventListener('mousemove',
				
				// getting the evt with the mouse's info, passing it in the calculate the mouse's position
				function(evt) {
					var mousePos = mouse_position(evt);
					
					// gets the Y off of it that we returned
					user_paddle = mousePos.y - PADDLE_HEIGHT/2;
					
					// the line above returns the newly updated Y pos of the paddle
				});
		}

		/* function callBoth () {
			moveEverything();
			drawEverything();
		} */

		function ballReset () {
			if (p_1_score >= WINNING_SCORE || p_2_score >= WINNING_SCORE) {
				win_screen = true;
			}

			b_vel_x = -b_vel_x;
			ball_x = canvas.width/2;
			ball_y = canvas.height/2;
		}

		function computerMovement () {
			var paddle2YCenter = ai_paddle + (PADDLE_HEIGHT/2);
			if (paddle2YCenter < ball_y - 35) {
				ai_paddle += 10;
			} else if (paddle2YCenter > ball_y + 35) {
				ai_paddle -= 10;
			}
		}

		function moveEverything () {
			if (win_screen) {
				return;
			}
			computerMovement();

			ball_x += b_vel_x;
			ball_y += b_vel_y;
			
			if (ball_x >= canvas.width) {
				if (ball_y > ai_paddle && ball_y < ai_paddle + PADDLE_HEIGHT) {
					b_vel_x = -b_vel_x;

					var deltaY = ball_y - (ai_paddle+PADDLE_HEIGHT/2);
					b_vel_y = deltaY * 0.35;
				
				} else {
					p_1_score++;
					ballReset();
				}
			}
			
			if (ball_x <= 0) {
				if (ball_y > user_paddle && ball_y < user_paddle + PADDLE_HEIGHT) {
					b_vel_x = -b_vel_x;
					
					var deltaY = ball_y - (user_paddle+PADDLE_HEIGHT/2);
					b_vel_y = deltaY * 0.35;
				
				} else {
					p_2_score++;
					ballReset();
				}
			}
			
			if (ball_y >= canvas.height || ball_y <= 0) {
				b_vel_y = -b_vel_y;
			}

		}

		function drawNet() {
			for (var i=0;i<canvas.height;i+=40) {
				colorRect(canvas.width/2-1,i,2,20,'turquoise');
			}
		}

		function drawEverything() {
			// next line blanks out the screen with black 
			colorRect(0,0,canvas.width,canvas.height,'black');

			if (win_screen) {
				canvas_context.fillStyle = 'red';

				if (p_1_score >= WINNING_SCORE) {
					canvas_context.fillText("Human won.", 320,200);
				} else if (p_2_score >= WINNING_SCORE) {
					canvas_context.fillText("AI won.", 320,200);
				}
				
				canvas_context.font = "20px Georgia";
				canvas_context.fillText("Click to play again!", 320,500);
				return;
			}
			
			drawNet ();

			// this is left player paddle
			colorRect(1,user_paddle,PADDLE_THICKNESS  ,PADDLE_HEIGHT,'red');
			
			// this is right computer paddle
			colorRect(canvas.width-PADDLE_THICKNESS-2,ai_paddle,PADDLE_THICKNESS ,PADDLE_HEIGHT,'purple');
			
			// this is the ball
			colorCircle(ball_x, ball_y, PADDLE_THICKNESS , 'blue');

			canvas_context.font = "20px Georgia";
			canvas_context.fillText(p_1_score, 100, 100);
			canvas_context.fillText(p_2_score, canvas.width-100, 100);
		}

		function colorRect (leftX, topY, width, height, drawColor)  {
			canvas_context.fillStyle = drawColor;
			canvas_context.fillRect(leftX, topY, width, height);
		}

		function colorCircle (centerX, centerY, radius, drawColor) {
			canvas_context.fillStyle = drawColor;
			canvas_context.beginPath();
			
			// (x, y, radius, start angle, finish angle, cw/ccw from the angles given)
			canvas_context.arc(centerX, centerY, radius, 0, Math.PI*2, true);
			canvas_context.fill();
		}
	</script>

</html>
